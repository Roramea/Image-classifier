<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易分 - 图标生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #333; margin-bottom: 30px; font-size: 28px; }
        .icon-preview { margin: 30px 0; }
        .icon-preview svg { width: 150px; height: 150px; }
        .download-section { margin-top: 30px; }
        .download-btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%); color: white; text-decoration: none; border-radius: 30px; font-size: 16px; font-weight: bold; transition: transform 0.3s, box-shadow 0.3s; }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59,130,246,0.4); }
        .formats { margin-top: 20px; font-size: 14px; color: #666; }
        .format-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .format-btn { padding: 8px 16px; border: 2px solid #3b82f6; color: #3b82f6; border-radius: 20px; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .format-btn:hover { background: #3b82f6; color: white; }
        .info { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; font-size: 13px; color: #555; line-height: 1.6; }
        .info strong { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>《易分》应用图标</h1>
        
        <div class="icon-preview">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" id="icon-svg">
                <defs>
                    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
                        <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:0.95" />
                    </linearGradient>
                </defs>
                <rect rx="30" ry="30" width="256" height="256" fill="url(#bgGradient)"/>
                <g transform="translate(50, 60)">
                    <path d="M120 20 L120 100 L20 100 L20 40 L95 40 L95 20 Z" fill="url(#folderGradient)" stroke="#ffffff" stroke-width="3"/>
                    <path d="M20 40 L20 100 L120 100 L120 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M95 20 L95 40 L20 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="35" y="55" width="70" height="12" rx="6" fill="#3b82f6" opacity="0.8"/>
                    <rect x="35" y="75" width="50" height="12" rx="6" fill="#10b981" opacity="0.8"/>
                    <rect x="35" y="95" width="85" height="12" rx="6" fill="#f59e0b" opacity="0.8"/>
                </g>
                <text x="128" y="205" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">易分</text>
            </svg>
        </div>

        <div class="download-section">
            <div class="formats">选择下载格式：</div>
            <div class="format-btns">
                <button class="format-btn" onclick="downloadSVG()">SVG 格式</button>
                <button class="format-btn" onclick="downloadPNG()">PNG 格式 (256x256)</button>
            </div>
        </div>

        <div class="info">
            <strong>使用说明：</strong><br>
            1. 点击上方按钮下载图标文件<br>
            2. 如需 ICO 格式，可使用在线转换工具（如 Convertio）将 PNG 转换为 ICO<br>
            3. 将图标应用到《易分》应用程序中<br>
            4. 图标文件已保存在项目目录中：<code>易分.svg</code>
        </div>
    </div>

    <script>
        function downloadSVG() {
            const svg = document.getElementById('icon-svg').outerHTML;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '易分.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadPNG() {
            const svg = document.getElementById('icon-svg');
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            const svgData = new XMLSerializer().serializeToString(svg);
            const img = new Image();
            
            img.onload = function() {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const dataURL = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataURL;
                a.download = '易分.png';
                a.click();
            };
            
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            img.src = url;
        }
    </script>
</body>
</html>
